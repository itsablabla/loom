server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Openship: route API calls to the backend service (same origin)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $loom_backend http://loom-backend:8000;

    location /api/ {
        proxy_pass $loom_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";    # SSE: keep-alive, no upgrade
        proxy_buffering off;                # SSE: stream events immediately
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
